services:
  postgres:
    image: postgres:16-alpine
    container_name: qjhy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qjhy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qjhy_dev_password}
      POSTGRES_DB: qjhy
    ports:
      - "5432:5432"
    volumes:
      - qjhy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qjhy -d qjhy"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: qjhy-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qjhy:${POSTGRES_PASSWORD:-qjhy_dev_password}@postgres:5432/qjhy
      AUTH_SECRET: ${AUTH_SECRET}
      EMERGENCY_LOGIN_PASSWORD: ${EMERGENCY_LOGIN_PASSWORD}
      DINGTALK_BOT_WEBHOOK: ${DINGTALK_BOT_WEBHOOK:-}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
      EDITING_NAS_PATH: /mnt/qjhy-edit
      COURSE_NAS_PATH: /mnt/miracle-courses
      PROJECT_ASSETS_PATH: /mnt/qjhy-edit/project-assets
    ports:
      - "3000:3000"
    volumes:
      - editing_nas:/mnt/qjhy-edit
      - course_nas:/mnt/miracle-courses

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: qjhy-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qjhy:${POSTGRES_PASSWORD:-qjhy_dev_password}@postgres:5432/qjhy
      AUTH_SECRET: ${AUTH_SECRET}
      EMERGENCY_LOGIN_PASSWORD: ${EMERGENCY_LOGIN_PASSWORD}
      DINGTALK_BOT_WEBHOOK: ${DINGTALK_BOT_WEBHOOK:-}
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      EDITING_NAS_PATH: /mnt/qjhy-edit
    volumes:
      - editing_nas:/mnt/qjhy-edit

volumes:
  qjhy_postgres_data:
  # 与 PRO3 共用：source/edited/cover 三个根目录下用 {产品}-新/ 子目录
  editing_nas:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=172.16.39.61,nolock,soft,rw"
      device: ":/volume1/docker/miracle-pro-cs/server/uploads/editing"
  # 课程中心继续读写 Miracle Pro3 的原课程资源目录，不复制媒体文件。
  course_nas:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=172.16.39.61,nolock,soft,rw"
      device: ":/volume1/docker/miracle-pro-cs/server/uploads/courses"
